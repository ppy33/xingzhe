name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    name: 密钥泄漏扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 扫描硬编码密钥
        run: |
          echo "按形态特征扫描密钥（不依赖任何真实值）……"
          FAIL=0

          # 1) 代码/文档里的 .env 式赋值出现真实值（.env.example 不在扫描范围）
          if grep -rInE '^[[:space:]]*(AMAP_SERVER_KEY|AMAP_JSAPI_KEY|AMAP_JSAPI_SECRET|DEEPSEEK_API_KEY)[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{8,}' \
               --include='*.md' --include='*.py' --include='*.vue' --include='*.js' --include='*.ts' \
               --include='*.json' --include='*.yml' --include='*.yaml' --include='*.txt' . ; then
            echo "::error::检测到疑似真实密钥被写进文件（应只放在本地 .env）"
            FAIL=1
          fi

          # 2) sk- 开头的 API Key
          if grep -rInE 'sk-[A-Za-z0-9]{20,}' . --exclude-dir=.git ; then
            echo "::error::检测到疑似 API Key（sk- 开头）"
            FAIL=1
          fi

          # 3) 高德 Key 形态：32 位十六进制串
          if grep -rInE '\b[0-9a-f]{32}\b' . --exclude-dir=.git ; then
            echo "::error::检测到疑似高德 Key 形态的 32 位十六进制串"
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "✓ 未发现密钥泄漏"

  backend:
    name: 后端语法与导入检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: v2/backend/requirements.txt

      - name: 安装依赖
        working-directory: v2/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        working-directory: v2/backend
        run: python -m compileall -q .

      - name: 导入检查（不需要密钥，缺密钥不应导致导入失败）
        working-directory: v2/backend
        run: python -c "import main; print('import ok:', main.app.title, main.app.version)"

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json

      - name: 安装依赖
        working-directory: v2/frontend
        run: npm ci

      - name: 构建（CI 下无 .env.local，缺少 Key 也应能构建成功）
        working-directory: v2/frontend
        run: npm run build
